server:
  port: -1

spring:
  datasource:
    url: jdbc:h2:mem:ledgerline_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000;DEFAULT_LOCK_TIMEOUT=30000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

jwt:
  secret: SuperSecretMissionCriticalLedgerLineKeyThatIsAtLeast32BytesLong!
  expiration: 86400000

logging:
  level:
    com.ledgerline: INFO
